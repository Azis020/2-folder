<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Sederhana</title>
    <style>
        /* CSS: Untuk mempercantik tampilan */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 350px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
        }

        button#addBtn {
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button#addBtn:hover {
            background-color: #218838;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background: #fff;
            border-bottom: 1px solid #eee;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }

        li:hover {
            background-color: #fafafa;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Daftar Tugas Saya</h2>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Tulis tugas baru...">
            <button id="addBtn">Tambah</button>
        </div>

        <ul id="taskList">
            <!-- Daftar tugas akan muncul di sini -->
        </ul>
    </div>

    <script>
        // JAVASCRIPT: Logika program

        // 1. Mengambil elemen dari HTML
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');

        // 2. Fungsi untuk menambahkan tugas
        function addTask() {
            const taskText = taskInput.value;

            // Validasi: Jangan tambah jika input kosong
            if (taskText === '') {
                alert("Tulis sesuatu dulu dong!");
                return;
            }

            // Membuat elemen <li> baru
            const li = document.createElement('li');
            
            // Membuat teks tugas
            const span = document.createElement('span');
            span.textContent = taskText;
            
            // Membuat tombol hapus
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Hapus';
            deleteBtn.className = 'delete-btn';

            // Menambahkan event listener ke tombol hapus
            deleteBtn.onclick = function() {
                li.remove(); // Menghapus elemen li dari DOM
            };

            // Menggabungkan elemen
            li.appendChild(span);
            li.appendChild(deleteBtn);

            // Memasukkan <li> ke dalam <ul>
            taskList.appendChild(li);

            // Mengosongkan input setelah menambah
            taskInput.value = '';
        }

        // 3. Menjalankan fungsi saat tombol "Tambah" diklik
        addBtn.addEventListener('click', addTask);

        // Bonus: Bisa tekan Enter untuk menambah
        taskInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

    </script>
</body>
</html>
